name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Lint Dependencies
        run: uv sync --frozen --group lint

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run djLint Template Linter
        run: uv run djlint --check example/

      - name: Run Mypy Type Checker
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --group test --group example

      - name: Run Package Unit Tests
        run: uv run pytest tests/

      - name: Run Example Application Tests
        run: uv run pytest -c example/pytest.ini example/

  build-check:
    name: Package & Docs Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify Package Build
        run: uv build

      - name: Install Docs Dependencies
        run: uv sync --frozen --group docs

      - name: Verify Docs Build
        run: uv run sphinx-build -b html docs site/docs
