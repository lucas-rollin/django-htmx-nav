name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Lint Dependencies
        run: uv sync --frozen --group lint

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run djLint Template Linter
        run: uv run djlint --check example/

      - name: Run Mypy Type Checker
        run: uv run mypy

  test-matrix:
    name: Package Tests (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        django-version:
          - "6.0"
          - "6.1"
          - "latest"
        include:
          - django-version: "6.0"
            django-spec: "django~=6.0.0"
          - django-version: "6.1"
            django-spec: "django~=6.1.0"
          - django-version: "latest"
            django-spec: "django"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --group test

      - name: Run Package Unit Tests
        run: uv run --group test --with "${{ matrix.django-spec }}" --upgrade-package django pytest tests/

  test-example:
    name: "Example Tests (Render & Static runtime: Python 3.14, Django 6.1)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Locked Example & Test Dependencies
        run: uv sync --frozen --group test --group example

      - name: Run Example Application Tests
        run: uv run pytest -c example/pytest.ini example/

  build-check:
    name: Package & Static Site Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Verify Package Build & Wheel Installation
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl python -c "import htmx_nav, importlib.metadata; print(f'Successfully installed and imported {htmx_nav.__name__} {importlib.metadata.version(\"django-htmx-nav\")}')"

      - name: Install Docs & Example Dependencies
        run: uv sync --frozen --group docs --group example

      - name: Verify Static Site Freeze & Docs Build
        env:
          ENVIRONMENT: static_generation
          STATIC_ROOT: site/static
          STATIC_URL: /django-htmx-nav/static/
        run: |
          uv run python example/manage.py collectstatic --noinput
          uv run python example/manage.py freeze_static_pages --out site --prefix /django-htmx-nav/
          uv run sphinx-build -b html docs site/docs
          touch site/.nojekyll
