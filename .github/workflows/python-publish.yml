name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build release distributions
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl python -c "import htmx_nav, importlib.metadata; print(f'Validated build: {htmx_nav.__name__} {importlib.metadata.version(\"django-htmx-nav\")}')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/django-htmx-nav/
      
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
