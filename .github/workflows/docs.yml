name: Deploy Documentation & Static Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[docs,example]

      - name: Build Static Site & Sphinx Docs
        env:
          ENVIRONMENT: static_generation
          STATIC_ROOT: site/static
          STATIC_URL: /django-htmx-nav/static/
        run: |
          python example/manage.py collectstatic --noinput

          python example/manage.py freeze_static_pages --out site --prefix /django-htmx-nav/

          sphinx-build -b html docs site/docs

          touch site/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4