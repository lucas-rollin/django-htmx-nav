name: Deploy Documentation & Static Site

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Dependencies
        run: uv sync --frozen --group docs --group example

      - name: Build Static Site & Sphinx Docs
        env:
          ENVIRONMENT: static_generation
          STATIC_ROOT: site/static
          STATIC_URL: /django-htmx-nav/static/
        run: |
          uv run python example/manage.py collectstatic --noinput
          uv run python example/manage.py freeze_static_pages --out site --prefix /django-htmx-nav/
          uv run sphinx-build -b html docs site/docs
          touch site/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4