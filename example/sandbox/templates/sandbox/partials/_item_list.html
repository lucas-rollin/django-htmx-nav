<div class="p-6 max-w-4xl mx-auto">
  <div class="space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">Sandbox Items</h1>
      <span class="badge badge-primary">PathReplace active</span>
    </div>
    <p class="text-base-content/70 prose">
      This page uses <code>PathReplace("pages/", "partials/_")</code>.
    </p>
    <button hx-get="{% url 'sandbox:item_list' %}" class="btn btn-outline">Refresh results</button>
    <div class="grid gap-3">
      {% for item in items %}
        <div class="card bg-base-100 border border-base-200 p-4 shadow-xs">
          <h3 class="font-semibold text-lg">{{ item.name }}</h3>
          <p class="text-sm text-base-content/60">{{ item.description }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
