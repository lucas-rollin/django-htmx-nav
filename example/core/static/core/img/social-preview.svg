<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>django-htmx-nav: Server-Driven Navigation for HTMX in Django</title>

  <style>
    .sans { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
    /* code tokens */
    .kw { fill: #f43f5e; }  /* keywords */
    .df { fill: #60a5fa; }  /* function being defined */
    .fn { fill: #34d399; }  /* library calls */
    .st { fill: #f472b6; }  /* strings */
    .pm { fill: #c084fc; }  /* keyword arguments */
    .pu { fill: #94a3b8; }  /* punctuation */
    .tx { fill: #cbd5e1; }  /* plain code */
  </style>

  <defs>
    <radialGradient id="bg-glow" cx="15%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="accent-glow" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <clipPath id="card-clip">
      <rect width="560" height="380" rx="16" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#accent-glow)" />

  <!-- Subtle grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <path d="M0,105H1200M0,210H1200M0,315H1200M0,420H1200M0,525H1200" />
    <path d="M200,0V630M400,0V630M600,0V630M800,0V630M1000,0V630" />
  </g>

  <!-- Left: branding and value prop -->
  <g transform="translate(64, 99)">
    <!-- Logo (matches favicon.svg) -->
    <rect width="56" height="56" rx="12" fill="#6754DD" />
    <text x="28" y="38" class="mono" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle">hn</text>
    <text x="72" y="38" class="sans" font-weight="700" font-size="30" fill="#f8fafc">django-htmx-nav</text>

    <!-- Headline -->
    <text x="0" y="134" class="sans" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-1.5">Server-Driven</text>
    <text x="0" y="198" class="sans" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-1.5">Navigation for</text>
    <text x="0" y="262" class="sans" font-weight="900" font-size="56" fill="#34d399" letter-spacing="-1.5">HTMX in Django</text>

    <!-- Subtitle -->
    <text x="0" y="316" class="sans" font-size="22" fill="#94a3b8">Keep sidebars, breadcrumbs and tabs</text>
    <text x="0" y="346" class="sans" font-size="22" fill="#94a3b8">in sync with the URL.</text>

    <!-- Install pill -->
    <g transform="translate(0, 384)">
      <rect width="390" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="31" class="mono" font-weight="600" font-size="20" fill="#34d399">$ pip install django-htmx-nav</text>
    </g>
  </g>

  <!-- Right: code card -->
  <g transform="translate(576, 125)">
    <!-- Frame (shadow only on this rect) -->
    <rect width="560" height="380" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2" filter="url(#shadow)" />

    <g clip-path="url(#card-clip)">
      <!-- Header bar -->
      <rect width="560" height="48" fill="#0f172a" />

      <!-- Highlight the two Swap lines -->
      <rect x="0" y="250" width="560" height="52" fill="#10b981" opacity="0.10" />
      <rect x="0" y="250" width="3" height="52" fill="#10b981" />
    </g>

    <circle cx="24" cy="24" r="6" fill="#ef4444" />
    <circle cx="44" cy="24" r="6" fill="#f59e0b" />
    <circle cx="64" cy="24" r="6" fill="#10b981" />
    <text x="280" y="29" class="mono" font-size="13" fill="#64748b" text-anchor="middle">views.py</text>

    <!-- Code: one <text> per line, so column alignment never depends on font metrics -->
    <g class="mono" font-size="14" transform="translate(14, 86)">
      <text x="0" y="0">
        <tspan class="kw">def </tspan>
        <tspan class="df">ticket_detail</tspan><tspan class="pu">(</tspan><tspan class="tx">request, pk</tspan><tspan class="pu">):</tspan>
      </text>

      <text x="32" y="26">
        <tspan class="tx">ticket = get_object_or_404(Ticket, pk=pk)</tspan>
      </text>

      <text x="32" y="52">
        <tspan class="kw">return </tspan><tspan class="fn">render_nav</tspan><tspan class="pu">(</tspan>
      </text>

      <text x="64" y="78">
        <tspan class="tx">request,</tspan>
      </text>

      <text x="64" y="104">
        <tspan class="st">"tickets/detail.html"</tspan><tspan class="pu">,</tspan>
      </text>

      <text x="64" y="130">
        <tspan class="pu">{</tspan><tspan class="st">"ticket"</tspan><tspan class="pu">: </tspan><tspan class="tx">ticket</tspan><tspan class="pu">},</tspan>
      </text>

      <text x="64" y="156">
        <tspan class="pm">swaps</tspan><tspan class="pu">=[</tspan>
      </text>

      <text x="96" y="182">
        <tspan class="fn">Swap</tspan><tspan class="pu">(</tspan><tspan class="st">"_sidebar.html"</tspan><tspan class="pu">, </tspan><tspan class="pm">target_id</tspan><tspan class="pu">=</tspan><tspan class="st">"sidebar"</tspan><tspan class="pu">),</tspan>
      </text>

      <text x="96" y="208">
        <tspan class="fn">Swap</tspan><tspan class="pu">(</tspan><tspan class="st">"_breadcrumbs.html"</tspan><tspan class="pu">, </tspan><tspan class="pm">target_id</tspan><tspan class="pu">=</tspan><tspan class="st">"breadcrumbs"</tspan><tspan class="pu">),</tspan>
      </text>

      <text x="64" y="234">
        <tspan class="pu">],</tspan>
      </text>

      <text x="32" y="260">
        <tspan class="pu">)</tspan>
      </text>
    </g>
  </g>
</svg>