<div role="tablist"
     class="tabs tabs-lift mb-6"
     {% if "tabs" in active_variant.component_swaps %}hx-target="#tab-content" {% endif %}
     {% if active_variant.namespace == "hx_select" %}hx-select="#tab-content" hx-select-oob="#sidebar, #breadcrumbs, #tabs"{% endif %}>
  {% for tab in tabs %}
    <a role="tab"
       class="tab {% if tab.active %}tab-active font-semibold{% endif %}"
       href="{{ tab.url }}">{{ tab.label }}</a>
  {% endfor %}
</div>
