{% load nav_extras %}
<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
  {% for status, tickets in columns.items %}
    <div class="bg-base-200/50 rounded-box p-3">
      <div class="flex items-center justify-between mb-3 px-1">
        <span class="badge {{ status|status_badge_class }}">{{ status|status_label }}</span>
        <span class="text-xs text-base-content/50" id="column-count-{{ status }}">{{ tickets|length }}</span>
      </div>
      <div class="space-y-2" id="column-{{status}}">
        {% for ticket in tickets %}
          {% partialdef ticket-card inline %}
            <div id="ticket-{{ ticket.id }}"
                 class="card bg-base-100 border border-base-300">
              <div class="card-body p-3 gap-2">
                <a href="{% url request.resolver_match.namespaces|last|add:':ticket_detail' ticket.id %}"
                   class="link link-hover text-sm font-medium">{{ ticket.title }}</a>
                <div class="rating rating-xs pointer-events-none">
                  {% for i in "12345" %}
                    <input type="radio"
                           class="mask mask-star-2 {% if forloop.counter <= ticket.priority %}bg-warning{% else %}bg-base-300{% endif %}"
                           disabled
                           {% if forloop.counter == ticket.priority %}checked{% endif %}>
                  {% endfor %}
                </div>
                <form method="post"
                      action="{% url request.resolver_match.namespaces|last|add:':ticket_move_status' ticket.id %}"
                      {% if active_variant.namespace == "htmx_nav_atomic" %}hx-swap="beforeend"{% endif %}
                      class="flex gap-1">
                  {% csrf_token %}
                  <select name="new_status" class="select select-xs flex-1">
                    <option value="open" {% if ticket.status == "open" %}selected{% endif %}>Open</option>
                    <option value="in_progress"
                            {% if ticket.status == "in_progress" %}selected{% endif %}>In progress</option>
                    <option value="resolved"
                            {% if ticket.status == "resolved" %}selected{% endif %}>Resolved</option>
                    <option value="closed" {% if ticket.status == "closed" %}selected{% endif %}>Closed</option>
                  </select>
                  <button type="submit" class="btn btn-xs btn-primary">Move</button>
                </form>
              </div>
            </div>
          {% endpartialdef %}
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
