<svg class="size-{{ size|default:'4' }} transition-transform duration-200 group-hover:translate-{{ direction|default:'x' }}-0.5"
     fill="none"
     stroke="currentColor"
     viewBox="0 0 24 24"
     aria-hidden="true">
  {% if direction == 'y' %}
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
  {% else %}
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
  {% endif %}
</svg>
