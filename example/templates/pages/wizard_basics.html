{% extends "base.html" %}
{% block title %}New ticket · Basics{% endblock %}
{% block content %}
  {% partialdef content inline %}
    <div class="p-6 max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold mb-1">New ticket</h1>
      <p class="text-base-content/60 mb-6">{{ project.name }} · {{ org.name }}</p>
      {% include "components/_wizard_steps.html" %}
      <form method="post" class="card bg-base-100 border border-base-300">
        {% csrf_token %}
        <div class="card-body gap-4">
          <fieldset class="fieldset">
            <label class="label" for="id_title">Title</label>
            <input id="id_title"
                   type="text"
                   name="title"
                   required
                   class="input w-full"
                   value="{{ collected.title|default:'' }}"
                   placeholder="Short summary of the issue">
          </fieldset>
          <fieldset class="fieldset">
            <label class="label" for="id_description">Description</label>
            <textarea id="id_description"
                      name="description"
                      required
                      class="textarea w-full h-32"
                      placeholder="What's going on?">{{ collected.description|default:'' }}</textarea>
          </fieldset>
          <div class="card-actions justify-end">
            <a href="{% url 'mpa:project_overview' org.id project.id %}"
               class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Continue</button>
          </div>
        </div>
      </form>
    </div>
  {% endpartialdef %}
{% endblock %}
