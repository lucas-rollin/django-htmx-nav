{% if enabled %}
  <div class="drawer drawer-end">
    <input id="src-drawer" type="checkbox" class="drawer-toggle" checked />
    <div class="drawer-content">{# ...your existing page markup goes here via block, see note below... #}</div>
    <div class="drawer-side z-50">
      <label for="src-drawer" class="drawer-overlay"></label>
      <div class="bg-base-100 w-full sm:w-3xl h-full p-4 overflow-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <h3 class="font-mono text-sm font-semibold mb-2">{{ view_name }}</h3>
            <pre class="mockup-code text-xs"><code>{{ view_source }}</code></pre>
          </div>
          <div class="space-y-4">
            {% for path, content in template_files %}
              <div>
                <p class="font-mono text-xs opacity-60 mb-1">{{ path }}</p>
                <pre class="mockup-code text-xs"><code>{{ content|default:"(not found on disk)" }}</code></pre>
              </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endif %}
{% endcomment %}
