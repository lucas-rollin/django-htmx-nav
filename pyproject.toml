[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-htmx-nav"
version = "0.3.0"
description = "Helpers for server-driven HTMX navigation in Django, with the URL as the source of truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Rollin Ferreira" }]
dependencies = [
    "Django>=6.0"
]

[project.optional-dependencies]
htmx = [
    "django-htmx>=1.17",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.0",
    "sphinx-autodoc-typehints>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
htmx_nav = ["py.typed"]

[project.urls]
"Homepage" = "https://github.com/lucas-rollin/django-htmx-nav"
"Documentation" = "https://lucas-rollin.github.io/django-htmx-nav/"
"Repository" = "https://github.com/lucas-rollin/django-htmx-nav"
