[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-htmx-nav"
version = "0.3.3"
description = "Helpers for server-driven HTMX navigation in Django, with the URL as the source of truth."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lucas Rollin Ferreira" }]
dependencies = [
    "Django>=6.0"
]

classifiers = [
    "Framework :: Django :: 6.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.0",
    "sphinx-autodoc-typehints>=3.0",
]
example = [
    "Faker==40.36.0",
    "gunicorn>=22.0.0",
    "whitenoise>=6.6.0",
    "django-environ==0.14.0",
]
bench = [
    "playwright",
    "radon>=6.0",
    "beautifulsoup4>=4.12",
    "requests",
    "psutil",
]
lint = [
    "ruff==0.16.2",
    "djlint==1.44.1",
    "mypy>=2.3.1",
    "django-stubs>=6.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
htmx_nav = ["py.typed", "static/htmx_nav/*.css"]

[project.urls]
"Homepage" = "https://lucas-rollin.github.io/django-htmx-nav/"
"Documentation" = "https://lucas-rollin.github.io/django-htmx-nav/docs/"
"Repository" = "https://github.com/lucas-rollin/django-htmx-nav"
"Live Demo" = "https://django-htmx-nav.onrender.com/"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["example/frontpage/templates"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
"**/apps.py" = ["F401"]

[tool.djlint]
profile = "django"
exclude = "src/,snippets/,tests/"
max_line_length = 120
wrap_attributes = true
ignore = "H021,H025"
indent = 2

[tool.mypy]
files = ["src", "example"]
mypy_path = ["src", "example"]
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
exclude = ["templates"]

strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = false
